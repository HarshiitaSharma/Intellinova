<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile & Loyalty - IntelliNova</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .profile-container {
            display: flex;
            flex-wrap: wrap; /* Allows wrapping on small screens */
            gap: 30px;
            margin-top: 30px;
        }
        .profile-info {
            flex: 1;
            min-width: 300px;
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow-light);
            text-align: center;
        }
        .loyalty-details {
            flex: 2;
            min-width: 400px;
            background-color: var(--card-background);
            padding: 30px;
            border-radius: 10px;
            box-shadow: var(--shadow-light);
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
        }
        .profile-pic {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid var(--primary-color);
        }
        .loyalty-card {
            background-color: var(--background-color);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }
        .loyalty-card h3 {
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }
        .badge-list {
            grid-column: 1 / -1; /* Span full width */
            text-align: center;
            padding-top: 10px;
        }
        .badge-list p {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .badge {
            font-size: 3rem;
            opacity: 0.3; /* Locked badge */
            margin: 0 10px;
            cursor: default;
            transition: opacity 0.3s;
        }
        .badge.unlocked {
            opacity: 1;
            color: var(--star-color);
        }
    </style>
</head>
<body>
    <header>
        <nav id="main-nav">
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">👤 Profile & Loyalty Status</h2>
        
        <div class="profile-container">
            <div class="profile-info">
                <div class="header-profile-icon profile-pic" id="profile-user-initial" 
                    style="margin: 0 auto 15px auto;">
                   ?
                </div> 
    
                <h2 id="profile-user-name">Loading User...</h2>
                <p id="profile-user-email" style="color: var(--secondary-color);">Loading role...</p>
    
                <button class="btn btn-primary" style="margin-top: 20px; background-color: #dc3545;" onclick="logoutUser()">
                Logout
                </button>
            </div>

            <div class="loyalty-details">
                <div class="loyalty-card">
                    <p style="font-size: 1.1rem; color: var(--secondary-color);">Total Points Earned</p>
                    <h3 id="loyalty-points">40</h3>
                    <p style="font-size: 0.9rem;">(Earn +10 points per purchase)</p>
                </div>
                <div class="loyalty-card">
                    <p style="font-size: 1.1rem; color: var(--secondary-color);">Purchases Completed</p>
                    <h3 id="purchase-count">4</h3>
                    <p style="font-size: 0.9rem;">(Next badge at 5 purchases)</p>
                </div>
                <div class="badge-list">
                    <p>🏆 Badges Unlocked 🏆</p>
                    <div>
                        <span class="badge unlocked" title="First Buy: Purchase 1 item">⭐</span>
                        <span class="badge" title="Trophy Shopper: Purchase 5 items (LOCKED)">🏆</span>
                        <span class="badge" title="IntelliNova VIP: Purchase 10 items (LOCKED)">👑</span>
                    </div>
                    <p style="margin-top: 15px; color: #dc3545; font-size: 1rem;">**Need 1 more purchase for the Trophy Shopper Badge!**</p>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Function to run when the profile page loads
        function loadUserProfile() {
            const user = getCurrentUser(); // Function is in script.js

            if (user) {
                // Update the elements with the user data
                document.getElementById('profile-user-initial').textContent = user.initial;
                document.getElementById('profile-user-name').textContent = user.name;
                document.getElementById('profile-user-email').innerHTML = 
                    `${user.email} |
                    Member since 2024`;
            } else {
                // If not logged in, redirect to login page
                window.location.href = 'login.html';
            }
        }

        document.addEventListener('DOMContentLoaded', loadUserProfile);
    </script>
    
</body>
</html>
