<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - IntelliNova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav id="main-nav">
            </nav>
    </header>

    <div class="container">
        <div class="auth-form-container">
            <h2>🚀 Join IntelliNova!</h2>
            <form id="signup-form">
                <div class="form-group">
                    <label for="signup-name">Full Name</label>
                    <input type="text" id="signup-name" placeholder="Bhumika" required>
                </div>
                <div class="form-group">
                    <label for="signup-email">Email</label>
                    <input type="email" id="signup-email" placeholder="bhumika@gmail.com" required>
                </div>
                <div class="form-group">
                    <label for="signup-password">Password</label>
                    <input type="password" id="signup-password" placeholder="Min 6 characters" required>
                </div>
                <button type="submit" class="btn btn-primary">Sign Up & Start Shopping</button>
            </form>
            <div class="switch-link">
                Already have an account? <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById('signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            // Mocking a successful signup and immediate login
            const name = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            
            alert(`Welcome, ${name}! Your account has been created.`);
            loginUser(email, name); // Function from script.js
        });
    </script>
    
</body>
</html>
