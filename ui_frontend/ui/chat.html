<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot - IntelliNova</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav id="main-nav">
            <!-- Navigation populated by script.js -->
        </nav>
    </header>

    <div class="container">
        <h2 class="section-title">💬 Talk to IntelliNova AI</h2>
        
        <div class="chat-container">
            <div class="chat-window" id="chat-window">
                <div class="message bot-message">
                    <div class="message-bubble">Hello! I am IntelliNova, your AI shopping assistant. Ask me anything about our products!</div>
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Type your message here..." onkeypress="if(event.keyCode === 13) sendMessage()">
                <button class="btn btn-primary" onclick="sendMessage()">Send</button>
                <button class="btn btn-primary" id="voice-btn" onclick="startVoice()" style="background-color: #dc3545;">🎤</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        const API_URL = "http://localhost:5000/chat";

        // 1. Check if we arrived from "Ask AI" button
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const query = urlParams.get('query');
            if (query) {
                // Auto-fill and send
                document.getElementById('chat-input').value = query;
                sendMessage(query);
            }
        });

        async function sendMessage(manualText = null) {
            const input = document.getElementById('chat-input');
            const message = manualText || input.value.trim();
            if (!message) return;

            const chatWindow = document.getElementById('chat-window');

            // Display User Message
            chatWindow.innerHTML += `
                <div class="message user-message">
                    <div class="message-bubble">${message}</div>
                </div>
            `;
            input.value = '';
            chatWindow.scrollTop = chatWindow.scrollHeight;

            // Loading Bubble
            const loadingId = "loading-" + Date.now();
            chatWindow.innerHTML += `
                <div class="message bot-message" id="${loadingId}">
                    <div class="message-bubble">Typing...</div>
                </div>
            `;
            chatWindow.scrollTop = chatWindow.scrollHeight;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) throw new Error("Backend Error");

                const data = await response.json();

                // Remove loading and show AI reply
                document.getElementById(loadingId).remove();
                chatWindow.innerHTML += `
                    <div class="message bot-message">
                        <div class="message-bubble">${data.reply}</div>
                    </div>
                `;

            } catch (error) {
                document.getElementById(loadingId).remove();
                chatWindow.innerHTML += `
                    <div class="message bot-message">
                        <div class="message-bubble" style="color: red;">Error: Could not connect to app.py. Is the backend running?</div>
                    </div>
                `;
            }
            chatWindow.scrollTop = chatWindow.scrollHeight;
        }
        
        function startVoice() {
            if (!('webkitSpeechRecognition' in window)) {
                alert("Voice feature is only supported in Google Chrome.");
                return;
            }
            
            const recognition = new webkitSpeechRecognition();
            recognition.lang = "en-US";
            const btn = document.getElementById('voice-btn');
            
            btn.innerHTML = "👂 Listening..."; 
            recognition.start();

            recognition.onresult = function(event) {
                const transcript = event.results[0][0].transcript;
                sendMessage(transcript);
                btn.innerHTML = "🎤";
            };
            
            recognition.onerror = function(event) {
                console.error("Voice error", event);
                alert("Microphone error. Please check your browser permissions.");
                btn.innerHTML = "🎤";
            };

            recognition.onend = function() {
                btn.innerHTML = "🎤";
            };
        }
    </script>
</body>
</html>
